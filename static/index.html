<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="description" content="三角洲行动扑克牌收集进度记录">
  <title>牌盒记录 · 三角洲行动</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="noise" aria-hidden="true"></div>
  <section class="auth-screen" id="authScreen" aria-label="账号登录">
    <div class="auth-card">
      <div class="auth-brand"><span>△</span><strong>牌盒记录</strong></div>
      <p class="eyebrow">SECURE ARCHIVE / AUTH</p>
      <h1>登录你的<br><em>个人牌盒。</em></h1>
      <p class="auth-note">每个账号拥有独立收藏进度，可在手机和电脑之间同步。</p>
      <div class="auth-tabs" role="tablist" aria-label="账号操作">
        <button class="active" type="button" data-auth-mode="login">登录</button>
        <button type="button" data-auth-mode="register">注册</button>
      </div>
      <form class="auth-form" id="authForm">
        <label>
          <span>用户名</span>
          <input id="authUsername" name="username" autocomplete="username" minlength="3" maxlength="24" required placeholder="3–24 位文字或数字">
        </label>
        <label>
          <span>密码</span>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required placeholder="至少 8 位">
        </label>
        <p class="auth-error" id="authError" aria-live="polite"></p>
        <button class="auth-submit" id="authSubmit" type="submit">进入牌盒</button>
      </form>
    </div>
  </section>
  <header class="topbar">
    <a class="brand" href="#" aria-label="返回顶部">
      <span class="brand-mark">△</span>
      <span>
        <strong>牌盒记录</strong>
        <small>DELTA CARD ARCHIVE</small>
      </span>
    </a>
    <div class="top-actions">
      <div class="save-state" id="saveState" aria-live="polite">
        <span class="status-dot"></span>
        <span>正在连接</span>
      </div>
      <button class="account-button" id="accountButton" type="button" title="退出登录">
        <span id="accountName">--</span>
        <small>退出</small>
      </button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-copy">
        <p class="eyebrow">TACTICAL COLLECTION / 01</p>
        <h1>别让重复的牌<br><em>占掉背包。</em></h1>
        <p class="hero-note">撤离前快速确认。点一下标记已拥有，收藏进度会安全同步到你的账号。</p>
      </div>

      <div class="progress-panel" aria-label="收集进度">
        <div class="progress-top">
          <span>整体进度</span>
          <strong><span id="ownedCount">0</span><small>/54</small></strong>
        </div>
        <div class="progress-track"><span id="progressBar"></span></div>
        <div class="progress-meta">
          <span id="progressPercent">0% 已归档</span>
          <span id="missingText">还差 54 张</span>
        </div>
      </div>
    </section>

    <section class="controls" aria-label="筛选工具">
      <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="拥有状态">
        <button class="active" type="button" data-filter="all">全部 <span>54</span></button>
        <button type="button" data-filter="missing">未拥有 <span id="missingTabCount">54</span></button>
        <button type="button" data-filter="owned">已拥有 <span id="ownedTabCount">0</span></button>
      </div>
      <label class="sort-box">
        <span>排序</span>
        <select id="sortSelect" aria-label="扑克牌排序方式">
          <option value="rank">按点数</option>
          <option value="suit">按花色</option>
        </select>
      </label>
      <label class="search-box">
        <span aria-hidden="true">⌕</span>
        <input id="searchInput" type="search" placeholder="搜索：红桃 A、黑桃、JOKER…" autocomplete="off">
      </label>
      <button class="icon-button" id="menuButton" type="button" aria-label="打开数据菜单" aria-expanded="false">•••</button>
      <div class="data-menu" id="dataMenu" hidden>
        <button type="button" id="markAllButton">全部标为拥有</button>
        <button type="button" id="exportButton">导出收藏数据</button>
        <button type="button" id="importButton">导入收藏数据</button>
        <button class="danger" type="button" id="resetButton">清空所有记录</button>
        <input id="importInput" type="file" accept="application/json,.json" hidden>
      </div>
    </section>

    <section class="collection" id="collection" aria-live="polite"></section>

    <section class="empty-state" id="emptyState" hidden>
      <span>◇</span>
      <h2>没有符合条件的牌</h2>
      <p>换个筛选条件或搜索词试试。</p>
    </section>
  </main>

  <footer>
    <span>△ 牌盒记录</span>
    <span>账号同步 · 自动保存</span>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/app.js" defer></script>
</body>
</html>
